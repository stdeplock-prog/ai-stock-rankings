<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Watchlist Rankings</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel2: #172033;
      --line: #243043;
      --text: #e5eefc;
      --muted: #93a4bd;
      --pill: #1f2937;
      --pill-high: #065f46;
      --pill-med: #854d0e;
      --pill-low: #4b5563;
      --star: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel2);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn, select, input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .btn { cursor: pointer; }

    .nav-link {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: #60a5fa;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-link:hover { background: var(--panel2); }

    main { padding: 16px; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .value {
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1500px;
    }

    /* Activity-adjusted diagnostic columns; same convention as main page. */
    .act-up { color: #22c55e; font-weight: 700; }
    .act-down { color: #f87171; font-weight: 700; }
    .act-flat { color: var(--muted); }

    @media (max-width: 640px) {
      .col-act-delta { display: none; }
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--panel2);
      font-size: 12px;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
    }

    tr:hover { background: rgba(255, 255, 255, .03); }

    tr.favorited {
      background: rgba(251, 191, 36, .08);
      border-left: 3px solid var(--star);
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }

    .pill-high { background: var(--pill-high); color: #d1fae5; }
    .pill-med { background: var(--pill-med); color: #fef3c7; }
    .pill-low { background: var(--pill-low); color: #e5e7eb; }

    .pill-ok { background: #064e3b; color: #d1fae5; }
    .pill-warn { background: #78350f; color: #fde68a; }
    .pill-err { background: #7f1d1d; color: #fecaca; }
    .pill-neutral { background: #374151; color: #d1d5db; }

    .ticker-link {
      color: #60a5fa;
      font-weight: 700;
      text-decoration: none;
    }

    .ticker-link:hover { text-decoration: underline; }

    .swing-badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      vertical-align: middle;
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--line);
      letter-spacing: .2px;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .swing-badge.tier-A { border-color: #10b981; color: #6ee7b7; box-shadow: inset 0 0 0 1px rgba(16,185,129,.25); }
    .swing-badge.tier-B { border-color: #f59e0b; color: #fcd34d; box-shadow: inset 0 0 0 1px rgba(245,158,11,.25); }
    .swing-badge.tier-C { border-color: #6b7280; color: #d1d5db; }
    .swing-badge.tier-D { border-color: #4b5563; color: #9ca3af; }

    .swing-badge .swing-tier-label {
      opacity: .85;
      margin-left: 3px;
      font-size: 10px;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      transition: color .2s;
    }

    .star-btn:hover,
    .star-btn.active { color: var(--star); }

    .err { color: #f87171; padding: 12px 0; font-size: 14px; }

    .chg-up, .chg-down, .chg-flat {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .chg-up { color: #22c55e; }
    .chg-down { color: #f87171; }
    .chg-flat { color: var(--muted); }

    .num { white-space: nowrap; }
    .price-cell { min-width: 88px; }
    .spark-cell { min-width: 96px; }
    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    .company-cell { min-width: 190px; }
    .industry-cell { min-width: 180px; font-size: 11px; }

    .src-pill {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      vertical-align: middle;
      margin-left: 6px;
    }
    .src-csv  { background: #1e3a8a; color: #bfdbfe; }
    .src-tv   { background: #4c1d95; color: #ddd6fe; }
    .src-both { background: #064e3b; color: #a7f3d0; }
    .src-supp { background: #78350f; color: #fde68a; }

    .unavailable-wrap {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
    }

    .unavailable-wrap .pillrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .unavailable-wrap .ticker-chip {
      background: #2a1a1a;
      border: 1px solid #5a1a1a;
      color: #fca5a5;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (max-width: 960px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .kpis { grid-template-columns: 1fr; }
      header { padding: 10px 12px; }
      main { padding: 12px; }
      th, td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <div class="label">Personal watchlist</div>
        <div style="font-size:22px;font-weight:700">Watchlist Rankings</div>
        <div id="updated" class="label" style="margin-top:4px">Last Updated: —</div>
        <div id="srcMeta" class="label" style="margin-top:2px;text-transform:none;letter-spacing:0;color:var(--muted)">Sources: —</div>
      </div>
      <div class="controls">
        <a class="nav-link" href="./index.html">← Main Rankings</a>
        <select id="sourceFilter">
          <option value="">All sources</option>
          <option value="csv">CSV only</option>
          <option value="tradingview">TradingView only</option>
          <option value="both">In both</option>
        </select>
        <input id="search" placeholder="Search ticker or company" aria-label="Search ticker or company" />
        <button class="btn" id="favFilterBtn">Show Watchlist (0)</button>
        <button class="btn" id="refreshBtn">Reload data</button>
        <button class="btn" id="exportBtn">Export CSV</button>
      </div>
    </div>
  </header>

  <main>
    <div class="kpis">
      <div class="card"><div class="label">Scored Rows</div><div class="value" id="kpiRows">0</div></div>
      <div class="card"><div class="label">AI 9-10</div><div class="value" id="kpiTop">0</div></div>
      <div class="card"><div class="label">Avg Technical</div><div class="value" id="kpiTech">0.00</div></div>
      <div class="card"><div class="label">Unavailable</div><div class="value" id="kpiUnavail">0</div></div>
    </div>

    <div id="suppSummary" class="label" style="margin:6px 2px 12px;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px"></div>

    <div id="errMsg" class="err"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:40px"></th>
            <th data-k="rank">Rank</th>
            <th style="width:60px" data-k="change" title="Rank change vs prior run">MOV</th>
            <th data-k="activity_rank" title="Activity-adjusted rank (diagnostic) within the watchlist universe. Liquidity + rel-vol + Pine accumulation overlay applied to AI score. Production rank unchanged.">ACT</th>
            <th class="col-act-delta" data-k="rank_delta" title="Production Rank minus ACT Rank. Positive means activity overlay promotes this ticker (e.g. Rank 15 → ACT 2 = +13).">ACT Δ</th>
            <th data-k="ticker">Ticker</th>
            <th data-k="company">Company</th>
            <th data-k="marketcap_sort">Mkt Cap</th>
            <th data-k="ai_score">AI</th>
            <th data-k="swing_score">SWING</th>
            <th data-k="change_vs_open">vs Open</th>
            <th data-k="fundamental">Fund</th>
            <th data-k="technical">Tech</th>
            <th data-k="sentiment">Sent</th>
            <th data-k="low_risk">Risk</th>
            <th data-k="volume_millions">Vol (M)</th>
            <th data-k="price">Price</th>
            <th>Spark</th>
            <th data-k="industry">Industry</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="unavailableBlock" class="unavailable-wrap" style="display:none">
      <div class="label">Unavailable Tickers</div>
      <div class="muted" style="font-size:12px;margin-top:4px" id="unavailableCount">—</div>
      <div class="pillrow" id="unavailablePills"></div>
    </div>
  </main>

  <script>
    const DATA_CANDIDATES = {
      rankings: ['./data/watchlist_rankings.json'],
      activityAdjusted: ['./data/reports/activity_adjusted_review.json']
    };

    // ticker -> { activity_rank, rank_delta } sourced from
    // data/reports/activity_adjusted_review.json `watchlist_rows`. The
    // overlay re-ranks within the watchlist universe; production rank is
    // never modified.
    let activityByTicker = {};

    let state = { rows: [], meta: {}, unavailable: [] };
    let sortKey = 'rank';
    let sortDir = 'asc';
    let showFavsOnly = false;
    let favorites = new Set();

    function loadFavorites() {
      try {
        if (typeof localStorage === 'undefined') return new Set();
        return new Set(JSON.parse(localStorage.getItem('favTickers') || '[]'));
      } catch { return new Set(); }
    }

    function saveFav() {
      try {
        if (typeof localStorage === 'undefined') return;
        localStorage.setItem('favTickers', JSON.stringify([...favorites]));
      } catch {}
    }

    favorites = loadFavorites();

    function toggleFav(ticker) {
      if (favorites.has(ticker)) favorites.delete(ticker);
      else favorites.add(ticker);
      saveFav();
      updateFavButton();
      applySearch();
    }

    function updateFavButton() {
      const btn = document.getElementById('favFilterBtn');
      btn.textContent = showFavsOnly ? 'Show All' : `Show Watchlist (${favorites.size})`;
    }

    function getVal(obj, ...keys) {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== '') return obj[key];
      }
      return null;
    }

    async function fetchFirstAvailable(paths) {
      let lastErr = null;
      for (const path of paths) {
        try {
          const res = await fetch(`${path}?cb=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
          return await res.json();
        } catch (err) { lastErr = err; }
      }
      throw lastErr || new Error('No data source available');
    }

    function parseMarketCap(value) {
      if (value == null) return null;
      if (typeof value === 'number') return value;
      const s = String(value).trim().toUpperCase();
      const m = s.match(/^([\d.]+)\s*([KMBT])?$/);
      if (!m) return null;
      const n = Number(m[1]);
      const mult = { K: 1e3, M: 1e6, B: 1e9, T: 1e12 }[m[2]] || 1;
      return n * mult;
    }

    function normalizeRow(row) {
      const closes = Array.isArray(row.closes)
        ? row.closes.map(Number).filter(v => Number.isFinite(v))
        : [];
      const marketcapDisplay = getVal(row, 'marketcapdisplay', 'market_cap_display', 'marketcap', 'market_cap');
      return {
        rank: Number(getVal(row, 'rank')) || 0,
        ticker: getVal(row, 'ticker') || '—',
        company: getVal(row, 'company') || '—',
        marketcapdisplay: marketcapDisplay,
        marketcap_sort: parseMarketCap(marketcapDisplay),
        ai_score: Number(getVal(row, 'ai_score', 'aiscore')),
        swing_score: getVal(row, 'swing_score', 'swingscore') != null ? Number(getVal(row, 'swing_score', 'swingscore')) : null,
        swing_tier: getVal(row, 'swing_tier', 'swingtier'),
        change: getVal(row, 'change', 'mov') != null ? Number(getVal(row, 'change', 'mov')) : 0,
        change_vs_open: getVal(row, 'change_vs_open', 'changevsopen') != null ? Number(getVal(row, 'change_vs_open', 'changevsopen')) : 0,
        fundamental: getVal(row, 'fundamental') != null ? Number(getVal(row, 'fundamental')) : null,
        technical: getVal(row, 'technical') != null ? Number(getVal(row, 'technical')) : null,
        sentiment: getVal(row, 'sentiment') != null ? Number(getVal(row, 'sentiment')) : null,
        low_risk: getVal(row, 'low_risk', 'lowrisk') != null ? Number(getVal(row, 'low_risk', 'lowrisk')) : null,
        volume_millions: getVal(row, 'volume_millions', 'volumemillions') != null ? Number(getVal(row, 'volume_millions', 'volumemillions')) : null,
        price: closes.length ? closes[closes.length - 1] : (getVal(row, 'price') != null ? Number(getVal(row, 'price')) : null),
        closes,
        industry: getVal(row, 'industry') || '—',
        sector: getVal(row, 'sector') || 'Unspecified',
        source: getVal(row, 'source') || 'unknown',
        data_source: getVal(row, 'data_source') || '',
        activity_rank: null,
        rank_delta: null
      };
    }

    function mergeActivityAdjusted(rows) {
      for (const r of rows) {
        const a = activityByTicker[r.ticker];
        if (a) {
          r.activity_rank = a.activity_rank;
          r.rank_delta = a.rank_delta;
        }
      }
    }

    function actCell(rank) {
      const n = Number(rank);
      if (!Number.isFinite(n) || n <= 0) return '<span class="muted">—</span>';
      return `<span class="num">${n}</span>`;
    }

    function actDeltaCell(delta) {
      const n = Number(delta);
      if (!Number.isFinite(n)) return '<span class="act-flat">—</span>';
      if (n > 0) return `<span class="act-up" title="Activity overlay promotes this ticker ${n} places">+${n}</span>`;
      if (n < 0) return `<span class="act-down" title="Activity overlay demotes this ticker ${Math.abs(n)} places">${n}</span>`;
      return '<span class="act-flat">0</span>';
    }

    function fmt(v, d = 1) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(d) : '—';
    }
    function fmtPrice(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(2) : '—';
    }
    function aiPill(score) {
      const s = Number(score);
      return s >= 9 ? 'pill-high' : s >= 7 ? 'pill-med' : 'pill-low';
    }

    function swingBadgeHTML(score, tier) {
      if (score == null || score === '') return '—';
      const t = (tier || '').toString().trim().toUpperCase();
      const cls = /^[ABCD]$/.test(t) ? `tier-${t}` : '';
      const s = Number(score);
      const shown = Number.isFinite(s) ? s.toFixed(1) : String(score);
      const label = t ? `<span class="swing-tier-label">${t}</span>` : '';
      const ttl = t ? `SwingScore ${shown} • Tier ${t}` : `SwingScore ${shown}`;
      return `<span class="swing-badge ${cls}" title="${ttl}">${shown}${label}</span>`;
    }

    function chg(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '<span class="muted">—</span>';
      if (n > 0) return `<span style="color:#22c55e">+${n.toFixed(2)}</span>`;
      if (n < 0) return `<span style="color:#ef4444">${n.toFixed(2)}</span>`;
      return '<span class="muted">0.00</span>';
    }

    function movCell(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '<span class="chg-flat">—</span>';
      if (n === 0) return '<span class="chg-flat" title="No rank change">• 0</span>';
      return n > 0
        ? `<span class="chg-up" title="Moved up ${Math.abs(n)}">▲ ${Math.abs(n)}</span>`
        : `<span class="chg-down" title="Moved down ${Math.abs(n)}">▼ ${Math.abs(n)}</span>`;
    }

    function drawSparkline(closes) {
      if (!closes || closes.length < 2) return '<span class="muted">—</span>';
      const mn = Math.min(...closes);
      const mx = Math.max(...closes);
      const rg = (mx - mn) || 1;
      const w = 80, h = 28;
      const pts = closes.map((v, i) => `${(i / (closes.length - 1)) * w},${h - ((v - mn) / rg) * h}`).join(' ');
      const last = closes[closes.length - 1];
      const prior = closes[closes.length - 2];
      const clr = last > prior ? '#22c55e' : last < prior ? '#ef4444' : '#93a4bd';
      return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${clr}" stroke-width="1.5"/></svg>`;
    }

    function srcPill(src, dataSource) {
      // Origin pills (TV/CSV/BOTH) cluttered the row without adding signal a
      // user acts on day-to-day. Source filtering and the header "Sources —"
      // line still expose this metadata. SUPP stays — it is a data-quality
      // indicator (supplemental yfinance fetch), not a list-origin label.
      const supp = dataSource === 'supplemental_yfinance';
      return supp
        ? `<span class="src-pill src-supp" title="Supplemental yfinance fetch (not in main pipeline)">SUPP</span>`
        : '';
    }

    function render(rows) {
      const tb = document.getElementById('tbody');
      tb.innerHTML = rows.map(r => {
        const fav = favorites.has(r.ticker);
        const marketCap = r.marketcapdisplay || '—';
        return `
          <tr class="${fav ? 'favorited' : ''}">
            <td><button class="star-btn ${fav ? 'active' : ''}" data-ticker="${r.ticker}" title="Toggle watchlist">${fav ? '★' : '☆'}</button></td>
            <td class="num">${r.rank}</td>
            <td>${movCell(r.change)}</td>
            <td>${actCell(r.activity_rank)}</td>
            <td class="col-act-delta">${actDeltaCell(r.rank_delta)}</td>
            <td>
              <a class="ticker-link" href="https://finance.yahoo.com/quote/${encodeURIComponent(r.ticker)}" target="_blank" rel="noopener noreferrer">${r.ticker}</a>
              ${srcPill(r.source, r.data_source)}
            </td>
            <td class="company-cell">${r.company}</td>
            <td class="num">${marketCap}</td>
            <td><span class="pill ${aiPill(r.ai_score)}">${fmt(r.ai_score)}</span></td>
            <td>${swingBadgeHTML(r.swing_score, r.swing_tier)}</td>
            <td class="num">${chg(r.change_vs_open)}</td>
            <td class="num">${fmt(r.fundamental)}</td>
            <td class="num">${fmt(r.technical)}</td>
            <td class="num">${fmt(r.sentiment)}</td>
            <td class="num">${fmt(r.low_risk)}</td>
            <td class="num">${fmt(r.volume_millions)}</td>
            <td class="num price-cell">${fmtPrice(r.price)}</td>
            <td class="spark-cell">${drawSparkline(r.closes)}</td>
            <td class="industry-cell">${r.industry}<br><span class="muted">${r.sector}</span></td>
          </tr>
        `;
      }).join('');

      const n = rows.length;
      document.getElementById('kpiRows').textContent = n;
      document.getElementById('kpiTop').textContent = rows.filter(r => Number(r.ai_score) >= 9).length;
      document.getElementById('kpiTech').textContent =
        n ? (rows.reduce((a, r) => a + (Number(r.technical) || 0), 0) / n).toFixed(2) : '0.00';

      document.querySelectorAll('.star-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggleFav(e.currentTarget.dataset.ticker);
        });
      });
    }

    function compareValues(a, b) {
      if (a == null && b == null) return 0;
      if (a == null) return 1;
      if (b == null) return -1;
      const an = Number(a), bn = Number(b);
      if (Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
      return String(a).localeCompare(String(b));
    }

    function applySearch() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const srcFilter = document.getElementById('sourceFilter').value;
      let rows = state.rows.slice();

      if (showFavsOnly) rows = rows.filter(r => favorites.has(r.ticker));
      if (srcFilter) rows = rows.filter(r => r.source === srcFilter);
      if (q) {
        rows = rows.filter(r =>
          r.ticker.toLowerCase().includes(q) ||
          (r.company || '').toLowerCase().includes(q) ||
          (r.industry || '').toLowerCase().includes(q)
        );
      }

      rows.sort((a, b) => {
        const cmp = compareValues(a[sortKey], b[sortKey]);
        return sortDir === 'asc' ? cmp : -cmp;
      });
      render(rows);
    }

    function renderUnavailable(unavailable) {
      const block = document.getElementById('unavailableBlock');
      const pills = document.getElementById('unavailablePills');
      const count = document.getElementById('unavailableCount');
      document.getElementById('kpiUnavail').textContent = unavailable.length;
      if (!unavailable.length) {
        block.style.display = 'none';
        return;
      }
      block.style.display = '';
      count.textContent = `${unavailable.length} ticker(s) could not be scored. Common reasons: foreign listing without yfinance support, OTC, or symbol mapping issue.`;
      pills.innerHTML = unavailable.map(u => {
        const lbl = u.tried ? `${u.input} → ${u.tried}` : u.input;
        const title = `Source: ${u.source || 'unknown'} • ${u.reason || ''}`;
        return `<span class="ticker-chip" title="${title.replace(/"/g,'&quot;')}">${lbl}</span>`;
      }).join('');
    }

    function renderSourceMeta(meta) {
      if (!meta) return;
      const el = document.getElementById('srcMeta');
      const parts = [];
      if (meta.csv_count != null) parts.push(`CSV: ${meta.csv_count}`);
      if (meta.tradingview_count != null) parts.push(`TV: ${meta.tradingview_count}`);
      if (meta.in_both != null) parts.push(`Both: ${meta.in_both}`);
      if (meta.combined_unique != null) parts.push(`Unique: ${meta.combined_unique}`);
      if (meta.scored != null) parts.push(`Scored: ${meta.scored}`);
      if (meta.unavailable_count) parts.push(`Unavailable: ${meta.unavailable_count}`);
      el.textContent = 'Sources — ' + parts.join(' · ');

      // SUPP coverage breakdown — option #4. Renders an honest summary of
      // what fraction of supplemental tickers have full fundamentals vs.
      // metadata-only / price-only / technical-only / unavailable, so the
      // page makes clear which SUPP rows came back rich and which thin.
      const suppEl = document.getElementById('suppSummary');
      if (!suppEl) return;
      const s = meta.supp_summary;
      if (!s || !s.total) { suppEl.textContent = ''; return; }
      const segs = [
        `full fundamentals ${s.full_fundamentals || 0}`,
        `metadata-only ${s.metadata_only || 0}`,
        `price-only ${s.price_only || 0}`,
        `technical-only ${s.technical_only || 0}`,
      ];
      if (s.unavailable) segs.push(`unavailable ${s.unavailable}`);
      suppEl.textContent = `SUPP enrichment (${s.total}) — ` + segs.join(' · ');
    }

    async function loadActivityAdjusted() {
      // Pulls the watchlist activity overlay block from the shared diagnostic
      // artifact. Missing/stale -> empty map; cells fall back to '—'.
      try {
        const aa = await fetchFirstAvailable(DATA_CANDIDATES.activityAdjusted);
        const rows = Array.isArray(aa.watchlist_rows) ? aa.watchlist_rows : [];
        activityByTicker = {};
        for (const r of rows) {
          if (r && r.ticker) {
            activityByTicker[r.ticker] = {
              activity_rank: r.activity_rank,
              rank_delta: r.rank_delta
            };
          }
        }
      } catch (_e) {
        activityByTicker = {};
      }
    }

    async function loadData() {
      try {
        const data = await fetchFirstAvailable(DATA_CANDIDATES.rankings);
        const rowsRaw = Array.isArray(data.rows) ? data.rows : [];
        await loadActivityAdjusted();
        state = { rows: rowsRaw.map(normalizeRow), meta: data, unavailable: data.unavailable || [] };
        mergeActivityAdjusted(state.rows);
        document.getElementById('updated').textContent = `Last Updated: ${getVal(data, 'as_of', 'asof') || '—'}`;
        document.getElementById('errMsg').textContent = '';
        renderSourceMeta(data.source_meta);
        renderUnavailable(state.unavailable);
        applySearch();
      } catch (e) {
        document.getElementById('errMsg').textContent = `Error loading watchlist: ${e.message}`;
      }
    }

    document.querySelectorAll('th[data-k]').forEach(th => {
      th.addEventListener('click', () => {
        const nextKey = th.dataset.k;
        if (sortKey === nextKey) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortKey = nextKey; sortDir = 'asc'; }
        applySearch();
      });
    });

    document.getElementById('search').addEventListener('input', applySearch);
    document.getElementById('sourceFilter').addEventListener('change', applySearch);
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('favFilterBtn').addEventListener('click', function () {
      showFavsOnly = !showFavsOnly;
      updateFavButton();
      applySearch();
    });

    document.getElementById('exportBtn').addEventListener('click', function () {
      const rows = state.rows;
      const csv = [
        'Rank,ActRank,ActDelta,Ticker,Company,AI,SWING,vsOpen,Fund,Tech,Sent,Risk,VolM,Price,Sector,Industry,Source',
        ...rows.map(r => [
          r.rank,
          r.activity_rank == null ? '' : r.activity_rank,
          r.rank_delta == null ? '' : r.rank_delta,
          r.ticker,
          `"${String(r.company).replaceAll('"', '""')}"`,
          r.ai_score,
          r.swing_score,
          r.change_vs_open,
          r.fundamental,
          r.technical,
          r.sentiment,
          r.low_risk,
          r.volume_millions,
          r.price,
          `"${String(r.sector).replaceAll('"', '""')}"`,
          `"${String(r.industry).replaceAll('"', '""')}"`,
          r.source
        ].join(','))
      ].join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'watchlist-rankings.csv';
      a.click();
    });

    updateFavButton();
    loadData();
    setInterval(loadData, 300000);
  </script>
</body>
</html>
