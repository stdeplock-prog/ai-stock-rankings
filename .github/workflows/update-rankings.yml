name: Update Stock Rankings

# Scheduling notes
# ----------------
# We want three runs per US weekday in America/Chicago: 08:45, 12:30, 15:35.
# GitHub Actions cron runs in UTC and has no native timezone support, so for
# DST coverage we register two UTC crons per slot (CDT vs CST). To keep DST
# from doubling the work, exactly one of each twin pair must execute on any
# given calendar day; the other must exit successfully (not fail).
#
# Robustness lessons hit in earlier designs:
#   1. GitHub Actions frequently delays *or drops* scheduled runs by several
#      minutes-to-hours under load (the 13:45 UTC slot in particular was
#      dropping every weekday). Cron lines are best-effort, not guarantees.
#   2. `exit 78` in a workflow `run:` step is treated as a normal failure;
#      neutral exit codes only apply to GitHub Apps check runs, not Actions
#      steps. Skips therefore showed as red failures.
#
# Current design:
#   * Each slot has FIVE cron lines per offset (primary + four 15-minute
#     backups spanning the next hour) so a delayed/dropped firing at the
#     primary minute still has multiple chances. GitHub Actions has been
#     observed to delay scheduled triggers by 30-60+ minutes under load,
#     so the backup window must extend well past the primary minute.
#     All five carry the same logical slot id; once one wins, slot-level
#     idempotency below short-circuits the rest.
#   * The "Decide whether this run should proceed" step uses
#     `github.event.schedule` (the literal cron string) to identify the
#     logical slot (morning/midday/close). Slot-level idempotency does
#     all the dedupe work, so the previous "twin offset" filter has been
#     dropped — it was rejecting valid firings on whichever DST offset
#     wasn't currently active and providing no protection that idempotency
#     doesn't already give us.
#   * Slot-level idempotency: if rankings.json's last commit on main is
#     already from today within this slot's window, subsequent firings
#     skip the heavy pipeline (proceed=false). The first cron to actually
#     succeed for the slot wins; later retries are cheap no-ops. This
#     also handles CDT/CST twin dedupe — only one of the offset pair can
#     win the slot per day.
#   * Manual `workflow_dispatch` always proceeds (overrides idempotency).
#   * No wall-clock minute matching, so GitHub Actions delays are tolerated.

on:
  schedule:
    # 08:45 America/Chicago slot — primary + four 15-min backups per offset.
    - cron: '45 13 * * 1-5'   # 08:45 CDT
    - cron: '0 14 * * 1-5'    # 09:00 CDT (backup 1)
    - cron: '15 14 * * 1-5'   # 09:15 CDT (backup 2)
    - cron: '30 14 * * 1-5'   # 09:30 CDT (backup 3)
    - cron: '45 14 * * 1-5'   # 09:45 CDT (backup 4)  [also 08:45 CST primary]
    - cron: '0 15 * * 1-5'    # 09:00 CST (backup 1)
    - cron: '15 15 * * 1-5'   # 09:15 CST (backup 2)
    - cron: '30 15 * * 1-5'   # 09:30 CST (backup 3)
    - cron: '45 15 * * 1-5'   # 09:45 CST (backup 4)
    # 12:30 America/Chicago slot — primary + four 15-min backups per offset.
    - cron: '30 17 * * 1-5'   # 12:30 CDT
    - cron: '45 17 * * 1-5'   # 12:45 CDT (backup 1)
    - cron: '0 18 * * 1-5'    # 13:00 CDT (backup 2)
    - cron: '15 18 * * 1-5'   # 13:15 CDT (backup 3)
    - cron: '30 18 * * 1-5'   # 13:30 CDT (backup 4)  [also 12:30 CST primary]
    - cron: '45 18 * * 1-5'   # 12:45 CST (backup 1)
    - cron: '0 19 * * 1-5'    # 13:00 CST (backup 2)
    - cron: '15 19 * * 1-5'   # 13:15 CST (backup 3)
    - cron: '30 19 * * 1-5'   # 13:30 CST (backup 4)
    # 15:35 America/Chicago slot — primary + four 15-min backups per offset.
    - cron: '35 20 * * 1-5'   # 15:35 CDT
    - cron: '50 20 * * 1-5'   # 15:50 CDT (backup 1)
    - cron: '5 21 * * 1-5'    # 16:05 CDT (backup 2)
    - cron: '20 21 * * 1-5'   # 16:20 CDT (backup 3)
    - cron: '35 21 * * 1-5'   # 16:35 CDT (backup 4)  [also 15:35 CST primary]
    - cron: '50 21 * * 1-5'   # 15:50 CST (backup 1)
    - cron: '5 22 * * 1-5'    # 16:05 CST (backup 2)
    - cron: '20 22 * * 1-5'   # 16:20 CST (backup 3)
    - cron: '35 22 * * 1-5'   # 16:35 CST (backup 4)
  workflow_dispatch:           # Manual trigger from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rankings-main
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------
  # JOB 1: Run the data pipeline and push rankings.json
  # -------------------------------------------------------
  update-rankings:
    runs-on: ubuntu-latest

    steps:
      # Checkout up-front so the gate step can read git history for the
      # slot-level idempotency check, and the later push step has full
      # history available for rebase. fetch-depth: 0 keeps both happy.
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Decide whether this particular trigger should run the pipeline.
      # For schedule events, only the twin that matches today's actual
      # America/Chicago UTC offset proceeds; the other exits successfully
      # so the run shows green instead of red. workflow_dispatch always
      # proceeds. Per-slot idempotency: if the slot has already been
      # satisfied today (rankings.json committed within the slot window),
      # backup firings skip. The decision is exported as `proceed` and
      # `slot` for later steps.
      - name: Decide whether this run should proceed
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or non-schedule trigger - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Current offset from UTC in America/Chicago: -0500 in CDT, -0600 in CST.
          OFFSET=$(TZ=America/Chicago date +%z)
          DOW=$(TZ=America/Chicago date +%u)   # 1=Mon..7=Sun
          TODAY_CHI=$(TZ=America/Chicago date +%Y-%m-%d)
          SCHED='${{ github.event.schedule }}'
          echo "Trigger schedule: $SCHED"
          echo "Chicago offset:   $OFFSET (dow=$DOW, today=$TODAY_CHI)"

          if [ "$DOW" -gt 5 ]; then
            echo "Weekend in Chicago - skipping (success)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "slot=weekend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Map each cron to its logical slot id (morning/midday/close).
          # All cron lines in a slot's CDT+CST window map to the same SLOT,
          # and slot-level idempotency below dedupes them so only one
          # firing actually does the heavy work per slot per day.
          case "$SCHED" in
            # Morning slot: 13:45/14:00/14:15/14:30/14:45/15:00/15:15/15:30/15:45 UTC
            # (covers 08:45 CDT primary through 09:45 CST backup 4)
            '45 13 * * 1-5'|'0 14 * * 1-5'|'15 14 * * 1-5'|'30 14 * * 1-5'|'45 14 * * 1-5'|'0 15 * * 1-5'|'15 15 * * 1-5'|'30 15 * * 1-5'|'45 15 * * 1-5')
              SLOT='morning' ;;
            # Midday slot: 17:30 .. 19:30 UTC
            '30 17 * * 1-5'|'45 17 * * 1-5'|'0 18 * * 1-5'|'15 18 * * 1-5'|'30 18 * * 1-5'|'45 18 * * 1-5'|'0 19 * * 1-5'|'15 19 * * 1-5'|'30 19 * * 1-5')
              SLOT='midday' ;;
            # Close slot: 20:35 .. 22:35 UTC
            '35 20 * * 1-5'|'50 20 * * 1-5'|'5 21 * * 1-5'|'20 21 * * 1-5'|'35 21 * * 1-5'|'50 21 * * 1-5'|'5 22 * * 1-5'|'20 22 * * 1-5'|'35 22 * * 1-5')
              SLOT='close' ;;
            *)
              echo "Unknown schedule '$SCHED' - proceeding defensively."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "slot=unknown" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

          # Stale-firing guard. GitHub Actions sometimes delays scheduled
          # triggers by many hours; we don't want a close-slot cron from
          # the prior day to run at 03:00 the next morning. Each slot has
          # a wall-clock window in Chicago time outside which the firing
          # is treated as too stale to act on.
          NOW_HM=$(TZ=America/Chicago date +%H:%M)
          case "$SLOT" in
            morning) MIN_HM='08:45'; MAX_HM='12:00' ;;
            midday)  MIN_HM='12:30'; MAX_HM='15:00' ;;
            close)   MIN_HM='15:35'; MAX_HM='18:30' ;;
            *)       MIN_HM='00:00'; MAX_HM='23:59' ;;
          esac
          # Lexicographic compare on zero-padded HH:MM is safe.
          if [ "$NOW_HM" \< "$MIN_HM" ] || [ "$NOW_HM" \> "$MAX_HM" ]; then
            echo "Firing outside $SLOT window ($NOW_HM not in [$MIN_HM,$MAX_HM]) - skipping stale (success)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Slot-level idempotency. Fetch the timestamp of the most recent
          # commit that touched rankings.json on main, convert to Chicago
          # local time, and check whether the slot has already been
          # satisfied today (a commit in or after the slot's window today).
          LAST=$(git log -1 --format=%ct -- data/rankings.json 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            echo "No prior rankings.json commit found - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_DATE=$(TZ=America/Chicago date -d "@$LAST" +%Y-%m-%d)
          LAST_HM=$(TZ=America/Chicago date -d "@$LAST" +%H:%M)
          echo "Last rankings.json commit (Chicago): $LAST_DATE $LAST_HM"

          if [ "$LAST_DATE" != "$TODAY_CHI" ]; then
            echo "No commit today yet - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A commit at or after MIN_HM today satisfies the slot. No upper
          # bound on the satisfying commit (a later same-day commit always
          # counts as having covered the slot).
          if [ "$LAST_HM" \< "$MIN_HM" ]; then
            echo "Today's $SLOT slot not yet satisfied (last commit $LAST_HM < $MIN_HM) - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Today's $SLOT slot already satisfied (last commit $LAST_HM >= $MIN_HM) - skipping (success)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests yfinance scipy ta scikit-learn python-dotenv openpyxl lxml

      - name: Create required data directories
        if: steps.gate.outputs.proceed == 'true'
        run: |
          mkdir -p data/reference
          mkdir -p data/raw/ohlcv_daily
          mkdir -p data/processed/technical_indicators
          mkdir -p data/processed/scoring_outputs

      - name: Build universe (S&P 500 + Nasdaq 100)
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Data_Fetch/build_universe.py

      - name: Fetch OHLCV + fundamentals
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Data_Fetch/fetch_ohlcv.py
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}

      - name: Calculate technical indicators
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Indicators/calc_indicators.py

      - name: Score tickers
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Scoring_Engine/score_tickers.py

      - name: Fetch catalysts (earnings + analyst ratings)
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Data_Fetch/fetch_catalysts.py
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'yfinance' }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}

      - name: Score swing (SwingScore + tiers)
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Scoring_Engine/score_swing.py

      - name: Export rankings to JSON
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Scoring_Engine/export_to_json.py

      - name: Generate watchlist rankings JSON (CSV + TradingView union)
        if: steps.gate.outputs.proceed == 'true'
        run: python 02_Code/Python/Scoring_Engine/generate_watchlist_rankings.py
        continue-on-error: true

      # Daily reports: only generate on the morning slot (08:45 America/Chicago)
      # or on manual dispatch. Midday and close runs skip these so the reports
      # stay stable to the morning snapshot. The slot-level idempotency above
      # ensures at most one of the morning crons does heavy work per day.
      - name: Generate market risk monitor report
        if: >-
          steps.gate.outputs.proceed == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           steps.gate.outputs.slot == 'morning')
        run: python 02_Code/Python/Reports/market_risk_monitor.py
        continue-on-error: true

      - name: Generate options/earnings watchlist report
        if: >-
          steps.gate.outputs.proceed == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           steps.gate.outputs.slot == 'morning')
        run: |
          pip install markdown
          python 02_Code/Python/Reports/options_watchlist.py
        continue-on-error: true

      - name: Commit and push updated data files
        if: steps.gate.outputs.proceed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          git add data/watchlist_rankings.json 2>/dev/null || true
          git add data/watchlist_sources.json 2>/dev/null || true
          git add data/processed/scoring_outputs/rankings_daily_open.csv 2>/dev/null || true
          git add data/processed/scoring_outputs/rankings_daily_open_date.txt 2>/dev/null || true
          git add data/processed/catalysts.csv 2>/dev/null || true
          git add data/processed/scoring_outputs/swing_rankings.csv 2>/dev/null || true
          git add data/reference/master_universe.csv 2>/dev/null || true
          git add data/reports/market_risk_monitor.json 2>/dev/null || true
          git add reports/market-risk-monitor.html 2>/dev/null || true
          git add reports/options-watchlist.html 2>/dev/null || true
          # tasks.json is stamped by the daily report scripts (last_run /
          # next_run / status / summary). If we don't stage it here, the later
          # `git pull --rebase` aborts with "unstaged changes".
          git add data/tasks.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[auto] Update rankings $(date -u '+%Y-%m-%d %H:%M') UTC"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

    outputs:
      proceeded: ${{ steps.gate.outputs.proceed }}

  # -------------------------------------------------------
  # JOB 2: Deploy site to GitHub Pages (runs after Job 1)
  # Only deploy when the pipeline actually ran; otherwise the
  # gated-out twin would redeploy unchanged content (or fail).
  # -------------------------------------------------------
  deploy-pages:
    if: github.ref == 'refs/heads/main' && needs.update-rankings.outputs.proceeded == 'true'
    needs: update-rankings
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo (with fresh data)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
